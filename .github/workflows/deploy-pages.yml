name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fix public asset paths for project Pages
        run: |
          Get-ChildItem dist/client -Recurse -File -Include *.html,*.css,*.rsc | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace 'url\(/', 'url(/portfolio2026/'
            $content = $content -replace 'href="/', 'href="/portfolio2026/'
            Set-Content $_.FullName $content -NoNewline
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
