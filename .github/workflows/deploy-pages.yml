name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fix public asset paths for project Pages
        run: |
          for file in dist/client/_next/static/css/*.css dist/client/*.html dist/client/*.rsc; do
            [ -f "$file" ] || continue
            sed -i -e 's#url(/#url(/portfolio.com/#g' -e 's#href="/#href="/portfolio.com/#g' "$file"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
